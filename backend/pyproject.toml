[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geojson-editor-backend"
version = "0.1.0"
description = "FastAPI and SQLite foundation for GeoJSON Editor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "shapely>=2.0,<3",
    "ijson>=3.3,<4",
    "python-multipart>=0.0.20,<1",
    "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.16,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
